<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Vocal Finish V1</title><link rel="stylesheet" href="./src/styles.css"></head>
<body><div id="app"><main class="shell"><section class="rack"><header><div><span class="eyebrow">EDREN AUDIO</span><h1>VOCAL FINISH</h1><p>V1 • Vocal Finishing Rack</p></div><button id="power" class="power on" aria-label="Bypass">●</button></header><div class="preset"><label>PRESET</label><select id="preset"><option>Clean &amp; Natural</option><option>Warm &amp; Intimate</option><option>Modern R&amp;B</option><option>Airy Lead</option><option>Smooth &amp; Dark</option><option>Dreamy</option><option>Wide Backgrounds</option></select></div><section class="transport"><input id="audioFile" type="file" accept="audio/*" hidden><button id="load">LOAD VOCAL</button><button id="play" disabled>▶ PLAY</button><div class="track"><strong id="trackName">NO VOCAL LOADED</strong><span id="time">00:00 / 00:00</span></div><label class="mix">MIX <input id="mix" type="range" min="0" max="100" value="100"><span id="mixValue">100%</span></label></section><div id="controls" class="controls"></div><footer><div><b>INPUT</b><span class="meter"><i id="inputMeter"></i></span></div><button id="reset">RESET</button><div class="output"><b>OUTPUT</b><input id="output" type="range" min="-12" max="6" step="0.5" value="0"><span id="outputValue">0 dB</span></div></footer></section><p class="note">Audio engine ready • load a dry vocal to test</p></main></div><script type="module" src="./src/main.ts"></script></body></html>
